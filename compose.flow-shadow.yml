services:
  flow-shadow:
    build:
      context: .
      dockerfile: Dockerfile.flow-shadow
    platform: linux/amd64
    shm_size: 512m
    security_opt:
      - seccomp:./ops/flow_chrome_seccomp.json
    restart: unless-stopped
    volumes:
      - type: bind
        source: ${SHADOW_PRIVATE_HOST_DIR:?Set an isolated private directory}
        target: /opt/state-zero-flow-shadow
        bind:
          create_host_path: false
      - type: bind
        source: ${SHADOW_PROFILE_HOST_DIR:?Set an isolated profile directory}
        target: /opt/state-zero-flow-profile
        bind:
          create_host_path: false
    environment:
      FLOW_PREFLIGHT_PROJECT_ID: ${FLOW_PREFLIGHT_PROJECT_ID:?Set the saved Flow project ID}
      SHADOW_TRIAL_START_DATE: ${SHADOW_TRIAL_START_DATE:?Set the first trial date}
      SHADOW_ALERT_BOT_TOKEN: ${SHADOW_ALERT_BOT_TOKEN:?Set the shadow alert token}
      SHADOW_ALERT_CHAT_ID: ${SHADOW_ALERT_CHAT_ID:?Set the shadow alert chat ID}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set the prompt API key}
      PROMPT_GOOGLE_API_KEY: ${PROMPT_GOOGLE_API_KEY:?Set the prompt fallback key}
      OPENROUTER_CALL_DEADLINE_SECONDS: "200"
      WHOOP_CLIENT_ID: ${WHOOP_CLIENT_ID:?Set the shadow WHOOP client ID}
      WHOOP_CLIENT_SECRET: ${WHOOP_CLIENT_SECRET:?Set the shadow WHOOP client secret}
